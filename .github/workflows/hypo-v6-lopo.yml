name: Hypo V6 LOPO Validation

on:
  push:
    branches:
      - 'feat/hypo-v6-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-lopo-code:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r ml/requirements.txt pytest
      - name: Compile V6 pipeline
        working-directory: ml
        run: python -m py_compile ohio_t1dm_loader.py lopo_hypo_v6.py event_evaluation.py
      - name: Run V6 leakage guard tests
        working-directory: ml
        run: pytest -q test_lopo_v6.py
      - name: Explain data boundary
        run: echo 'Raw OhioT1DM XML is not stored in this public repository. Full LOPO training runs only against an authorised local dataset directory.'
