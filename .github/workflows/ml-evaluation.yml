name: ML Evaluation

on:
  push:
    branches:
      - fix/ml-evaluation-p0
  workflow_dispatch:

jobs:
  evaluate-lstm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Run leakage-safe event-aware evaluation
        run: python ml/lstm_hypoglycemia_classifier_v2.py

      - name: Show evaluation
        if: always()
        run: |
          if [ -f ml/models/evaluation_v2.json ]; then cat ml/models/evaluation_v2.json; fi

      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zyntra-ml-evaluation-v2
          path: |
            ml/models/evaluation_v2.json
            ml/models/optimal_threshold_v2.npy
          if-no-files-found: warn
