name: ML Evaluation

on:
  push:
    branches:
      - main
      - 'feat/hypo-v3-alert-quality'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  evaluate-lstm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: python -m pip install --upgrade pip && pip install -r ml/requirements.txt

      - name: Run leakage-safe event-aware LSTM evaluation
        working-directory: ml
        env:
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: python lstm_hypoglycemia_classifier_v2.py

      - name: Validate evaluation outputs
        run: |
          test -f ml/models/evaluation_v2.json
          test -f ml/models/alert_analysis.csv
          test -f ml/models/threshold_sweep.csv
          python - <<'PY'
          import json
          import pandas as pd
          report = json.load(open('ml/models/evaluation_v2.json'))
          alerts = pd.read_csv('ml/models/alert_analysis.csv')
          tp = alerts[alerts['classification'] == 'TP']
          if not tp.empty:
              assert (tp['lead_minutes'] > 0).all(), 'TP alert occurred at/after hypo onset'
              assert (tp['lead_minutes'] <= 30).all(), 'TP alert exceeds prediction horizon'
          print(json.dumps(report['alert_quality'], indent=2))
          PY

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zyntra-hypo-v3-evaluation
          path: |
            ml/models/evaluation_v2.json
            ml/models/alert_analysis.csv
            ml/models/threshold_sweep.csv
          if-no-files-found: error
